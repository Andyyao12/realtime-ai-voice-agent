[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-ai-voice-agent-showcase"
version = "0.1.1"
description = "Production-oriented realtime voice agent reference implementation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "aiohttp==3.14.3",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "livekit-agents[openai]>=1.6.7,<1.7",
  "livekit-plugins-anam==1.6.7",
  "pydantic-settings==2.10.1",
  "python-dotenv==1.2.2",
  "python-frontmatter==1.1.0",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.12.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live_rtc: requires explicit external LiveKit, OpenAI, and Anam credentials",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["frontmatter"]
ignore_missing_imports = true
